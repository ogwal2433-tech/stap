# Security360 web container: serves the built frontend AND proxies /api to the
# Security360 API.
#
# The primary stack splits these across two containers (web serves static, a
# separate nginx reverse-proxies and terminates TLS). This one collapses them
# because there is no certificate to terminate on the published port and one
# fewer moving part is worth more than mirroring the topology exactly. The host
# port is S360_PORT (8087 here; 8080 is held by Windows http.sys on this box).
# The proxy rules, body
# limit and /uploads handling are kept identical to nginx/nginx.conf so
# behaviour that depends on them — file uploads especially — matches.
#
# `proxy_pass http://api:3001` resolves inside security360_network, so it
# reaches this stack's API and cannot see the primary one.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Guard photos and generated PDFs are posted here; nginx defaults to 1M,
    # which rejects most scanned documents with a 413.
    client_max_body_size 10M;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    # Makes it obvious in devtools which environment a tab is pointed at.
    add_header X-Environment          "security360" always;

    location /api/ {
        proxy_pass            http://api:3001;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection 'upgrade';
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_cache_bypass    $http_upgrade;
        proxy_read_timeout    300s;
        proxy_connect_timeout 75s;
    }

    # Served from the shared uploads volume, same as production.
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(woff2?|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # React Router — anything not matched above is an app route.
    # index.html must never be cached. Its whole job is to name the current
    # build's hashed chunks, and those names change every deploy. Cached, a
    # browser keeps asking for chunks the new build deleted and the app dies on
    # the first lazy route with "Failed to fetch dynamically imported module".
    # The hashed assets below are the opposite case: their names change when
    # their contents do, so they are safe to keep for a year.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json
               application/javascript text/javascript
               font/woff font/woff2;
}
