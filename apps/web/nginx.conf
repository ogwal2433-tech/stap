# Web container: serves the built frontend.
#
# In the production topology this container is internal — the separate nginx
# service owns ports 80/443, terminates TLS and reverse-proxies /api to the API
# container, so nothing here ever sees an /api request. QA overrides this file
# entirely with nginx-qa.conf, where the web container is the front door.
#
# The /api rule below is therefore normally dead weight, and deliberately kept:
# without it, a web container reached directly — a compose run without the nginx
# service, a port published for debugging — answers every API call with
# index.html, which surfaces as JSON parse errors rather than as a routing
# mistake. Prefix locations match longest-first, so it wins over `location /`
# regardless of the order they appear in.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Guard photos and generated PDFs are posted here; nginx defaults to 1M,
    # which rejects most scanned documents with a 413.
    client_max_body_size 10M;

    # Matches nginx/nginx.conf and nginx-qa.conf: `api` is the compose service
    # name, which resolves on both the production and QA networks. The container
    # names (stap-api, s360-api-qa) differ per environment; the service name
    # does not.
    location /api/ {
        proxy_pass            http://api:3001;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection 'upgrade';
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_cache_bypass    $http_upgrade;
        proxy_read_timeout    300s;
        proxy_connect_timeout 75s;
    }

    # index.html must never be cached. Its whole job is to name the current
    # build's hashed chunks, and those names change every deploy. Cached, a
    # browser keeps asking for chunks the new build deleted and the app dies on
    # the first lazy route with "Failed to fetch dynamically imported module".
    # The hashed assets below are the opposite case: their names change when
    # their contents do, so they are safe to keep for a year.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # React Router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Serve fonts with correct MIME types
    location ~* \.(woff2?|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/javascript
               font/woff font/woff2;
}