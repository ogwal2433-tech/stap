name: Deploy to Production

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  # ── Test ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stap_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stap/shared build
      - run: pnpm --filter api db:generate
      - run: cd apps/api && pnpm exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm --filter api test

  # ── Deploy ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Write .env file to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cat > /var/www/stap-security/.env << 'ENVEOF'
          POSTGRES_USER=stap_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=stap_production
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
          FRONTEND_URL=http://${{ secrets.DEPLOY_HOST }}
          ENVEOF"

      - name: Build and deploy on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            cd /var/www/stap-security

            echo "📥 Pulling latest code..."
            git fetch origin
            git checkout develop
            git pull origin develop

            echo "🔨 Building images..."
            docker compose build --no-cache

            echo "🚀 Starting services..."
            docker compose up -d --remove-orphans

            echo "⏳ Waiting for API health check..."
            sleep 10

            echo "✅ Checking container status..."
            docker compose ps

            echo "🔍 API health check..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost/api/v1/health)

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Deployment successful (HTTP $HTTP_STATUS)"
            else
              echo "❌ Health check failed (HTTP $HTTP_STATUS)"
              docker compose logs api --tail 30
              exit 1
            fi

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "🎉 Done!"
          ENDSSH

      - name: Post deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Server | ${{ secrets.DEPLOY_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
