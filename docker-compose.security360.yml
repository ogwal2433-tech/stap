# ─────────────────────────────────────────────────────────────────────────────
# Security360 — a second, separately-branded deployment
#
#   Web:      http://<host>:8080        (STAP stays on 80/443)
#   Data:     security360_postgres      (STAP uses postgres_data)
#   Network:  security360_network       (STAP uses stap-network)
#
# Nothing is shared with the STAP stack: different volumes, network, container
# names, database and Redis. The only overlap is the host, so neither can reach
# the other's data even by accident.
#
# Built from the SAME Dockerfiles the STAP stack uses. The brand is a build
# argument, not a fork — a parallel set of Dockerfiles would drift, and this
# deployment would stop being the same software.
#
#   docker compose -f docker-compose.security360.yml --env-file .env.security360 up -d --build
# ─────────────────────────────────────────────────────────────────────────────

name: security360

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: security360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${S360_POSTGRES_USER:-security360}
      POSTGRES_PASSWORD: ${S360_POSTGRES_PASSWORD:?S360_POSTGRES_PASSWORD is required — copy .env.security360.example to .env.security360}
      POSTGRES_DB:       ${S360_POSTGRES_DB:-security360}
    volumes:
      - s360_postgres_data:/var/lib/postgresql/data
    networks: [s360-network]
    # Deliberately not published to the host. The STAP stack keeps its database
    # internal too; a second Postgres on a host port is an exposure with no
    # purpose, since psql is one `docker exec` away.
    healthcheck:
      # -d as well as -U: without it pg_isready probes a database named after
      # the user and logs a FATAL that is not a real failure.
      test:         ["CMD-SHELL", "pg_isready -U ${S360_POSTGRES_USER:-security360} -d ${S360_POSTGRES_DB:-security360}"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: security360-redis
    restart: unless-stopped
    volumes:
      - s360_redis_data:/data
    networks: [s360-network]
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── API ─────────────────────────────────────────────────────────────
  api:
    build:
      context:    .
      dockerfile: apps/api/Dockerfile
    image: security360-api:latest
    container_name: security360-api
    restart: unless-stopped
    volumes:
      - s360_uploads:/app/public/uploads
    environment:
      NODE_ENV: production
      PORT:     3001

      # Branding. The API resolves this at boot, so renaming it needs only a
      # restart — unlike the frontend, which bakes it in at build time below.
      APP_NAME:     ${S360_APP_NAME:-Security360}
      APP_TAGLINE:  ${S360_APP_TAGLINE:-}
      # The legal entity on invoices, contracts and letters. Separate from the
      # product name on purpose: leaving it unset keeps STAP Security Ltd, which
      # is correct if this deployment is the same business under a new product
      # name, and wrong if it is not. Set it when it is not.
      COMPANY_NAME: ${S360_COMPANY_NAME:-}

      DATABASE_URL: postgresql://${S360_POSTGRES_USER:-security360}:${S360_POSTGRES_PASSWORD}@postgres:5432/${S360_POSTGRES_DB:-security360}
      REDIS_URL:    redis://redis:6379

      JWT_SECRET:         ${S360_JWT_SECRET:?S360_JWT_SECRET is required and must be at least 32 characters}
      JWT_REFRESH_SECRET: ${S360_JWT_REFRESH_SECRET:?S360_JWT_REFRESH_SECRET is required and must be at least 32 characters}
      COOKIE_SECRET:      ${S360_COOKIE_SECRET:-}

      # Session lengths. Also decides whether the refresh cookie is marked
      # Secure — an https:// URL means it is, anything else means it is not.
      FRONTEND_URL:               ${S360_FRONTEND_URL:-http://localhost:8080}
      JWT_EXPIRES_IN:             ${S360_JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN:     ${S360_JWT_REFRESH_EXPIRES_IN:-8h}
      SESSION_INACTIVITY_MINUTES: ${S360_SESSION_INACTIVITY_MINUTES:-30}

      SEED_PASSWORD:  ${S360_SEED_PASSWORD:-}
      APP_VERSION:    ${S360_APP_VERSION:-security360}
      ENABLE_SWAGGER: ${S360_ENABLE_SWAGGER:-false}

      # Mail. Blank leaves SMTP unconfigured, and the app says so in
      # Settings → Integrations rather than failing silently. A password
      # containing $ must be written $$ in the env file compose reads.
      SMTP_HOST:   ${S360_SMTP_HOST:-}
      SMTP_PORT:   ${S360_SMTP_PORT:-}
      SMTP_SECURE: ${S360_SMTP_SECURE:-}
      SMTP_USER:   ${S360_SMTP_USER:-}
      SMTP_PASS:   ${S360_SMTP_PASS:-}
      SMTP_FROM:   ${S360_SMTP_FROM:-}

      SETTINGS_ENCRYPTION_KEY: ${S360_SETTINGS_ENCRYPTION_KEY:?S360_SETTINGS_ENCRYPTION_KEY is required}

      # Payment gateway. Blank by default so this stack cannot move real money
      # until someone deliberately points it at an account.
      XCEL_API_KEY:                  ${S360_XCEL_API_KEY:-}
      XCEL_MERCHANT_ID:              ${S360_XCEL_MERCHANT_ID:-}
      XCEL_BASE_URL:                 ${S360_XCEL_BASE_URL:-}
      XCEL_WEBHOOK_URL:              ${S360_XCEL_WEBHOOK_URL:-}
      XCEL_DISBURSEMENT_WEBHOOK_URL: ${S360_XCEL_DISBURSEMENT_WEBHOOK_URL:-}
      XCEL_PRODUCT_ID:               ${S360_XCEL_PRODUCT_ID:-}
      XCEL_MERCHANT_ACCOUNT:         ${S360_XCEL_MERCHANT_ACCOUNT:-}
      XCEL_BANK_CODE:                ${S360_XCEL_BANK_CODE:-}
      XCEL_PARTNER_ID:               ${S360_XCEL_PARTNER_ID:-}
      XCEL_PARTNER_API_KEY:          ${S360_XCEL_PARTNER_API_KEY:-}
      XCEL_PARTNER_BASE_URL:         ${S360_XCEL_PARTNER_BASE_URL:-}
      XCEL_CONFIG_PRESET:            ${S360_XCEL_CONFIG_PRESET:-}
      XCEL_DL_CODE_BASE_URL:         ${S360_XCEL_DL_CODE_BASE_URL:-}
    networks: [s360-network]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  # ── Worker (BullMQ) ─────────────────────────────────────────────────
  # Emails, audit entries and scheduled jobs are queued rather than run inline.
  # Without this container they are enqueued and never processed: no welcome
  # email is delivered, the audit log stays empty and no cron job ever fires.
  # The stack looks healthy and quietly does none of that work.
  worker:
    image: security360-api:latest
    container_name: security360-worker
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    healthcheck:
      # The image's own check asks an HTTP endpoint. A worker serves no HTTP, so
      # it would sit permanently unhealthy while running correctly.
      test:         ["CMD-SHELL", "tr -d '\\0' < /proc/1/cmdline | grep -q worker.js"]
      interval:     30s
      timeout:      10s
      start_period: 40s
      retries:      3
    volumes:
      - s360_uploads:/app/public/uploads
    environment:
      NODE_ENV:     production
      APP_NAME:     ${S360_APP_NAME:-Security360}
      COMPANY_NAME: ${S360_COMPANY_NAME:-}
      DATABASE_URL: postgresql://${S360_POSTGRES_USER:-security360}:${S360_POSTGRES_PASSWORD}@postgres:5432/${S360_POSTGRES_DB:-security360}
      REDIS_URL:    redis://redis:6379
      JWT_SECRET:         ${S360_JWT_SECRET}
      JWT_REFRESH_SECRET: ${S360_JWT_REFRESH_SECRET}
      FRONTEND_URL:       ${S360_FRONTEND_URL:-http://localhost:8080}
      # This container drains the email queue, so it is the one that actually
      # needs the mail credentials.
      SMTP_HOST:   ${S360_SMTP_HOST:-}
      SMTP_PORT:   ${S360_SMTP_PORT:-}
      SMTP_SECURE: ${S360_SMTP_SECURE:-}
      SMTP_USER:   ${S360_SMTP_USER:-}
      SMTP_PASS:   ${S360_SMTP_PASS:-}
      SMTP_FROM:   ${S360_SMTP_FROM:-}
      SETTINGS_ENCRYPTION_KEY: ${S360_SETTINGS_ENCRYPTION_KEY}
    networks: [s360-network]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      api:      { condition: service_started }

  # ── Web (React + nginx) ─────────────────────────────────────────────
  web:
    build:
      context:    .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the bundle: static files cannot ask a server what they are.
        VITE_APP_NAME:     ${S360_APP_NAME:-Security360}
        VITE_APP_TAGLINE:  ${S360_APP_TAGLINE:-}
        VITE_COMPANY_NAME: ${S360_COMPANY_NAME:-}
    image: security360-web:latest
    container_name: security360-web
    restart: unless-stopped
    # The STAP stack splits static-serving and the API proxy across two
    # containers because it terminates TLS. There is no certificate here, so
    # this one does both — the mounted config adds the /api and /uploads rules.
    volumes:
      - ./apps/web/nginx-security360.conf:/etc/nginx/conf.d/default.conf:ro
      - s360_uploads:/var/www/uploads:ro
    ports:
      - "${S360_PORT:-8080}:80"
    networks: [s360-network]
    depends_on: [api]

volumes:
  s360_postgres_data:
    name: security360_postgres
  s360_redis_data:
    name: security360_redis
  s360_uploads:
    name: security360_uploads

networks:
  s360-network:
    name:   security360_network
    driver: bridge
