# Pinned rather than taken from the checkout directory: the deploy path is
# /var/www/security360, which would otherwise name this project "security360"
# and merge it with docker-compose.security360.yml. Volumes become
# s360-prod_postgres_data and so on.
name: s360-prod

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: s360-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-security360_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-security360_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - s360-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-security360_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: s360-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - s360-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API (Node.js) ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: s360-api-prod:latest
    container_name: s360-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-security360_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security360_production}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SEED_PASSWORD: ${SEED_PASSWORD}
      # Mail. The worker sends the queued messages, so it needs these too — a
      # password containing $ must be written $$ in the .env compose reads,
      # or interpolation eats it before the container ever sees it.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      XCEL_API_KEY: ${XCEL_API_KEY}
      XCEL_MERCHANT_ID: ${XCEL_MERCHANT_ID}
      XCEL_BASE_URL: ${XCEL_BASE_URL}
      XCEL_WEBHOOK_URL: ${XCEL_WEBHOOK_URL}
      XCEL_PRODUCT_ID: ${XCEL_PRODUCT_ID}
      XCEL_MERCHANT_ACCOUNT: ${XCEL_MERCHANT_ACCOUNT}
      XCEL_BANK_CODE: ${XCEL_BANK_CODE}
      XCEL_DISBURSEMENT_WEBHOOK_URL: ${XCEL_DISBURSEMENT_WEBHOOK_URL}
      XCEL_PARTNER_ID: ${XCEL_PARTNER_ID}
      XCEL_PARTNER_API_KEY: ${XCEL_PARTNER_API_KEY}
      XCEL_CONFIG_PRESET: ${XCEL_CONFIG_PRESET}
      XCEL_PARTNER_BASE_URL: ${XCEL_PARTNER_BASE_URL}
      XCEL_DL_CODE_BASE_URL: ${XCEL_DL_CODE_BASE_URL}
    volumes:
      - uploads:/app/public/uploads
    networks:
      - s360-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker (BullMQ) — shares the same image as api ──────────────────
  worker:
    image: s360-api-prod:latest
    container_name: s360-worker-prod
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    # The image's healthcheck asks an HTTP endpoint whether it is alive. A
    # worker serves no HTTP, so it would sit permanently unhealthy once it is
    # genuinely running worker.js. Check the process instead.
    healthcheck:
      test: ["CMD-SHELL", "tr -d '\\0' < /proc/1/cmdline | grep -q worker.js"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-security360_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security360_production}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      # This container drains the email queue, so it is the one that actually
      # needs the mail credentials. Same $$-escaping caveat as the api service.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
    volumes:
      - uploads:/app/public/uploads
    networks:
      - s360-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (React + Nginx) ────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: s360-web-prod:latest
    container_name: s360-web-prod
    restart: unless-stopped
    networks:
      - s360-prod-network
    depends_on:
      - api

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: s360-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/var/www/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - s360-prod-network
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  s360-prod-network:
    driver: bridge
