services:

  # ── PostgreSQL Database ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stap_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stap_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stap-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - stap-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API (Node.js) ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: stap-api:latest
    container_name: stap-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-stap_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stap_production}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SEED_PASSWORD: ${SEED_PASSWORD}
      XCEL_API_KEY: ${XCEL_API_KEY}
      XCEL_MERCHANT_ID: ${XCEL_MERCHANT_ID}
      XCEL_BASE_URL: ${XCEL_BASE_URL}
      XCEL_WEBHOOK_URL: ${XCEL_WEBHOOK_URL}
      XCEL_PRODUCT_ID: ${XCEL_PRODUCT_ID}
      XCEL_MERCHANT_ACCOUNT: ${XCEL_MERCHANT_ACCOUNT}
      XCEL_BANK_CODE: ${XCEL_BANK_CODE}
      XCEL_DISBURSEMENT_WEBHOOK_URL: ${XCEL_DISBURSEMENT_WEBHOOK_URL}
      XCEL_PARTNER_ID: ${XCEL_PARTNER_ID}
      XCEL_PARTNER_API_KEY: ${XCEL_PARTNER_API_KEY}
      XCEL_CONFIG_PRESET: ${XCEL_CONFIG_PRESET}
      XCEL_PARTNER_BASE_URL: ${XCEL_PARTNER_BASE_URL}
      XCEL_DL_CODE_BASE_URL: ${XCEL_DL_CODE_BASE_URL}
    volumes:
      - uploads:/app/public/uploads
    networks:
      - stap-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker (BullMQ) — shares the same image as api ──────────────────
  worker:
    image: stap-api:latest
    container_name: stap-worker
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stap_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stap_production}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    volumes:
      - uploads:/app/public/uploads
    networks:
      - stap-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (React + Nginx) ────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: stap-web:latest
    container_name: stap-web
    restart: unless-stopped
    networks:
      - stap-network
    depends_on:
      - api

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: stap-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/var/www/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - stap-network
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  stap-network:
    driver: bridge
